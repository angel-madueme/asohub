services:
  db:
    image: postgres:16
    container_name: asohub-db
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - asohub-db-data:/var/lib/postgresql/data

volumes:
  asohub-db-data:
