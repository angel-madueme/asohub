<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AsoHub — Order detail</title>
  <style>
    :root {
      --ink: #24211d;
      --muted: #756f68;
      --paper: #f8f4ed;
      --panel: #fffdfa;
      --line: #e7dfd4;
      --clay: #b85d3e;
      --clay-dark: #93462f;
      --clay-soft: #f5e4dc;
      --sage: #dce8d4;
      --sage-ink: #41613e;
      --danger: #a84747;
      --danger-soft: #f8e2df;
      --shadow: rgba(67, 49, 36, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Trebuchet MS", Arial, sans-serif;
      line-height: 1.5;
    }

    .shell {
      width: min(100% - 32px, 560px);
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 42px;
    }

    .brand {
      color: var(--clay-dark);
      font-family: Georgia, serif;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .menu {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--panel);
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--clay-dark);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      max-width: 390px;
      margin-bottom: 14px;
      font-family: Georgia, serif;
      font-size: clamp(2.25rem, 11vw, 3.5rem);
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 0.98;
    }

    .order-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--sage);
      color: var(--sage-ink);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .badge::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6f9c64;
      content: "";
    }

    .section { margin-top: 34px; }

    .balance-card {
      overflow: hidden;
      border-radius: 22px;
      background: var(--clay);
      box-shadow: 0 14px 32px var(--shadow);
      color: #fffaf5;
    }

    .balance-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 22px 22px 18px;
    }

    .balance-head p { margin-bottom: 3px; opacity: 0.78; font-size: 0.82rem; }
    .balance-head strong { font-size: 1.55rem; font-weight: 700; }
    .balance-mark { font-size: 1.6rem; opacity: 0.8; }

    .balance-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid rgba(255, 250, 245, 0.24);
    }

    .balance-grid div { padding: 16px 12px 18px 22px; }
    .balance-grid div + div { border-left: 1px solid rgba(255, 250, 245, 0.24); }
    .balance-grid span { display: block; margin-bottom: 4px; color: rgba(255, 250, 245, 0.7); font-size: 0.72rem; }
    .balance-grid b { font-size: 1.03rem; }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    h2 {
      margin-bottom: 0;
      font-family: Georgia, serif;
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: -0.03em;
    }

    .count { color: var(--muted); font-size: 0.78rem; }

    .payments {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }

    .payment {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 16px;
      align-items: center;
      padding: 16px 18px;
    }

    .payment + .payment { border-top: 1px solid var(--line); }
    .payment-date { color: var(--muted); font-size: 0.8rem; }
    .payment-amount { font-weight: 700; }
    .payment-status { display: flex; align-items: center; gap: 5px; color: var(--sage-ink); font-size: 0.77rem; font-weight: 700; }
    .payment-status::before { width: 6px; height: 6px; border-radius: 50%; background: #6f9c64; content: ""; }
    .payment-status.failed { color: var(--danger); }
    .payment-status.failed::before { background: var(--danger); }

    .pay-button {
      width: 100%;
      margin-top: 28px;
      padding: 16px 20px;
      border: 0;
      border-radius: 14px;
      background: var(--ink);
      color: #fffdfa;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.01em;
      box-shadow: 0 8px 18px var(--shadow);
    }

    .pay-button:hover { background: var(--clay-dark); }
    .pay-button:focus-visible { outline: 3px solid #d99a80; outline-offset: 3px; }

    @media (min-width: 520px) {
      .shell { padding-top: 32px; }
      .topbar { margin-bottom: 60px; }
      .balance-grid div { padding-right: 22px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">AsoHub</div>
      <button class="menu" aria-label="Open menu">⋯</button>
    </header>

    <section aria-labelledby="order-title">
      <p class="eyebrow">Order detail · #ASO-1048</p>
      <h1 id="order-title">Agbada, two piece</h1>
      <div class="order-meta">
        <span class="badge">In progress</span>
        <span>Ready by 14 November</span>
      </div>
    </section>

    <section class="section" aria-labelledby="balance-title">
      <div class="balance-card">
        <div class="balance-head">
          <div>
            <p id="balance-title">Your balance</p>
            <strong>₦85,000</strong>
          </div>
          <span class="balance-mark" aria-hidden="true">✦</span>
        </div>
        <div class="balance-grid">
          <div><span>Total</span><b>₦250,000</b></div>
          <div><span>Paid</span><b>₦165,000</b></div>
          <div><span>Still owed</span><b>₦85,000</b></div>
        </div>
      </div>
    </section>

    <section class="section" aria-labelledby="payments-title">
      <div class="section-title">
        <h2 id="payments-title">Payment history</h2>
        <span class="count">3 payments</span>
      </div>
      <div class="payments">
        <div class="payment">
          <div><div class="payment-amount">₦100,000</div><div class="payment-date">12 September 2024</div></div>
          <div class="payment-status">Paid</div>
        </div>
        <div class="payment">
          <div><div class="payment-amount">₦65,000</div><div class="payment-date">26 September 2024</div></div>
          <div class="payment-status">Paid</div>
        </div>
        <div class="payment">
          <div><div class="payment-amount">₦85,000</div><div class="payment-date">04 October 2024</div></div>
          <div class="payment-status failed">Failed</div>
        </div>
      </div>
      <button class="pay-button" type="button">Pay balance</button>
    </section>
  </main>
</body>
</html>
